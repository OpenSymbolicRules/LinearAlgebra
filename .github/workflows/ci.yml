name: Pilot checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run numerical and shape-guard tests
        run: python3 -m unittest discover -s tests -v
      - name: Produce numerical report
        run: python3 tests/run_checks.py > numerical-report.json
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - name: Install documentation dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl

  lean:
    name: Check mathematical statements with pinned OSR Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "revision=$(cat verification/lean-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OpenSymbolicRules/Lean
          ref: ${{ steps.pin.outputs.revision }}
          path: OSR-Lean
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib cache for the OSR OpenMath encoder
        working-directory: OSR-Lean
        run: lake exe cache get
      - name: Compile identities and counterexamples
        run: bash verification/check.sh OSR-Lean
